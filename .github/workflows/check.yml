name: Check release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: python3 -B -m unittest discover -s test -p 'release_scan_test.py'
      - run: python3 -B evidence/check.py
      - name: Verify paper and evidence
        shell: bash
        run: |
          policy=$(mktemp)
          trap 'rm -f "$policy"' EXIT
          CAPTAIN_PRIVATE_NAMES="$policy" python3 -B paper/verify.py
      - name: Scan release and reachable history
        run: python3 -B scripts/check-release.py --history
      - name: Run offline quickstart in a disposable copy
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          git archive HEAD | tar -x -C "$scratch"
          cp -R node_modules "$scratch/node_modules"
          cd "$scratch"
          timeout --kill-after=10s 5m npm run demo -- --run ci-check
